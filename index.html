<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<meta name="twitter:description" content="Buxgalteriya bo'yicha onlayn testlar, jonli seanslar va imtihonlar platformasi.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #0F2A26;
    --bg-2: #133330;
    --card: #16403A;
    --card-hi: #1B4B44;
    --edge: rgba(255,255,255,0.07);
    --teal: #2FC7AE;
    --teal-dark: #1E9C87;
    --white-ac: #F4F7F6;
    --ink: #EAF3F0;
    --ink-soft: #93B8B0;
    --red: #E5584B;
    --shadow-soft: 0 1px 0 rgba(255,255,255,0.05) inset, 0 14px 30px rgba(0,0,0,0.35);
    --shadow-hover: 0 1px 0 rgba(255,255,255,0.07) inset, 0 22px 46px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(47,199,174,0.10), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(47,199,174,0.06), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .app{max-width:960px;margin:0 auto;padding:28px 20px 90px;}
  .masthead{
    display:flex;align-items:center;gap:14px;justify-content:space-between;
    padding-bottom:20px;margin-bottom:26px;border-bottom:1px solid var(--edge);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:42px;height:42px;border-radius:11px;box-shadow:var(--shadow-soft);}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;margin:0;letter-spacing:0.02em;}
  .tagline{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ink-soft);letter-spacing:0.06em;margin-top:2px;}
  .mode-badge{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--teal);letter-spacing:0.08em;text-transform:uppercase;background:rgba(47,199,174,0.12);border:1px solid rgba(47,199,174,0.3);padding:6px 12px;border-radius:20px;}
  .hidden{display:none !important;}
  .card{
    background:linear-gradient(160deg, var(--card-hi), var(--card));
    border:1px solid var(--edge);
    border-radius:16px;
    box-shadow:var(--shadow-soft);
    padding:28px 26px;
    margin-bottom:20px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card.tilt:hover{
    transform:perspective(800px) rotateX(1.5deg) translateY(-3px);
    box-shadow:var(--shadow-hover);
  }
  .lead{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .desc{color:var(--ink-soft);font-size:0.93rem;margin:0 0 20px;line-height:1.55;}
  input[type=text],input[type=password],textarea,select{
    width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,0.12);
    border-radius:9px;background:rgba(0,0,0,0.18);font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);
  }
  input::placeholder,textarea::placeholder{color:rgba(147,184,176,0.55);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  label{display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:7px;font-weight:600;}
  .field{margin-bottom:16px;}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.92rem;
    border:none;border-radius:9px;padding:12px 20px;cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease, filter .1s ease;
  }
  button:active{transform:translateY(1px) scale(0.99);}
  .btn-primary{background:linear-gradient(135deg, var(--teal), var(--teal-dark));color:#06231E;box-shadow:0 8px 20px rgba(47,199,174,0.28);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:rgba(255,255,255,0.04);color:var(--ink);border:1px solid rgba(255,255,255,0.14);}
  .btn-ghost:hover{background:rgba(255,255,255,0.09);}
  .btn-danger{background:linear-gradient(135deg,#E5584B,#B93C30);color:#fff;}
  .btn-owner{background:linear-gradient(135deg,#F4F7F6,#C9D6D2);color:#0F2A26;}
  .btn-small{padding:7px 12px;font-size:0.8rem;}
  .row-item{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:16px 14px;border-radius:12px;margin-bottom:8px;
    background:rgba(0,0,0,0.14);border:1px solid var(--edge);
  }
  .row-num{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:0.85rem;width:28px;font-weight:600;}
  .row-title{font-weight:600;flex:1;min-width:160px;}
  .row-meta{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--ink-soft);}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:4px 10px;border-radius:20px;
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .badge-open{background:rgba(47,199,174,0.16);color:var(--teal);}
  .badge-done{background:rgba(244,247,246,0.12);color:var(--white-ac);}
  .badge-closed{background:rgba(255,255,255,0.06);color:var(--ink-soft);}
  .stamp{
    width:130px;height:130px;border-radius:50%;
    background:linear-gradient(145deg, var(--card-hi), var(--card));
    border:3px solid var(--teal);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:0 auto 20px;color:var(--teal);
    box-shadow:0 18px 40px rgba(47,199,174,0.22), 0 1px 0 rgba(255,255,255,0.08) inset;
    animation:stampIn .4s cubic-bezier(.2,1.4,.5,1);
  }
  .stamp.low{border-color:var(--red);color:var(--red);box-shadow:0 18px 40px rgba(229,88,75,0.22), 0 1px 0 rgba(255,255,255,0.08) inset;}
  @keyframes stampIn{from{transform:scale(0.5) rotate(-6deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .stamp .pct{font-family:'IBM Plex Mono',monospace;font-size:1.9rem;font-weight:600;}
  .stamp .lbl{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);}
  .qblock{border-bottom:1px solid var(--edge);padding:20px 0;}
  .qblock:last-child{border-bottom:none;}
  .qnum{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:0.85rem;margin-bottom:6px;}
  .qtext{font-weight:600;margin-bottom:14px;font-size:1.02rem;}
  .opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;margin-bottom:8px;cursor:pointer;background:rgba(0,0,0,0.1);transition:.12s;}
  .opt:hover{border-color:rgba(47,199,174,0.4);}
  .opt.selected{border-color:var(--teal);background:rgba(47,199,174,0.1);}
  .opt.correct{border-color:var(--teal);background:rgba(47,199,174,0.16);}
  .opt.wrong{border-color:var(--red);background:rgba(229,88,75,0.12);}
  .opt input{margin:0;accent-color:var(--teal);}
  .toplink{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:0.82rem;padding:0;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{padding:10px 18px;border-radius:9px;background:rgba(255,255,255,0.03);border:1px solid var(--edge);color:var(--ink-soft);font-size:0.85rem;font-weight:600;cursor:pointer;}
  .tab.active{background:var(--teal);color:#06231E;border-color:var(--teal);}
  .tab.owner-tab.active{background:var(--white-ac);color:#0F2A26;border-color:var(--white-ac);}
  table{width:100%;border-collapse:collapse;font-size:0.87rem;display:block;overflow-x:auto;white-space:nowrap;}
  table thead, table tbody{display:table;width:100%;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;text-transform:uppercase;color:var(--ink-soft);padding:9px 8px;border-bottom:1px solid var(--edge);}
  td{padding:11px 8px;border-bottom:1px solid var(--edge);}
  .pct-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .pct-low{color:var(--red);}
  .pct-ok{color:var(--teal);}
  .qeditor{border:1px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:12px;background:rgba(0,0,0,0.14);}
  .flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .flexrow > *{flex:1;min-width:140px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .footer-link{text-align:center;margin-top:28px;}
  .loading{text-align:center;padding:30px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:0.85rem;}
  canvas{max-height:280px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:6px;}
  .stat-box{background:rgba(0,0,0,0.16);border:1px solid var(--edge);border-radius:12px;padding:16px;}
  .stat-box .num{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600;color:var(--teal);}
  .stat-box .lbl{font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-top:4px;}
  .code-display{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;letter-spacing:0.06em;background:rgba(0,0,0,0.2);padding:12px 14px;border-radius:9px;border:1px solid var(--edge);display:inline-block;}
  .owner-strip{background:linear-gradient(135deg, rgba(244,247,246,0.08), rgba(244,247,246,0.02));border:1px solid rgba(244,247,246,0.18);}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card-hi);border:1px solid var(--teal);color:var(--ink);padding:13px 22px;border-radius:11px;font-size:0.88rem;font-weight:600;opacity:0;transition:opacity .25s ease, transform .25s ease;z-index:9999;box-shadow:var(--shadow-hover);pointer-events:none;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast-error{border-color:var(--red);}
  .timer-wrap{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .timer-bar-track{flex:1;height:9px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;}
  .timer-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark));width:100%;transition:width 1s linear, background .3s ease;border-radius:6px;}
  .timer-bar-fill.warn{background:linear-gradient(90deg,#E5584B,#B93C30);}
  .timer-num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.15rem;color:var(--teal);min-width:36px;text-align:right;}

  /* Live session — big screen (host) */
  #screen-live-host{max-width:1100px;margin:0 auto;}
  .live-big-timer{font-family:'IBM Plex Mono',monospace;font-size:3.2rem;font-weight:700;text-align:center;color:var(--teal);margin:6px 0 18px;}
  .live-big-q{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;text-align:center;margin-bottom:26px;line-height:1.3;}
  .live-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .live-opt{border-radius:14px;padding:22px;font-size:1.15rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:14px;min-height:80px;}
  .live-opt .letter{font-family:'IBM Plex Mono',monospace;font-size:1.4rem;background:rgba(0,0,0,0.2);border-radius:8px;padding:6px 14px;}
  .live-opt.c0{background:#D64545;} .live-opt.c1{background:#2F6BD6;} .live-opt.c2{background:#D6A02F;} .live-opt.c3{background:#2FA35C;}
  .live-opt.revealed-correct{outline:4px solid var(--teal);}
  .live-opt.revealed-wrong{opacity:0.35;}
  .live-lobby-players{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}
  .live-player-chip{background:rgba(47,199,174,0.14);border:1px solid rgba(47,199,174,0.3);color:var(--teal);padding:7px 14px;border-radius:20px;font-size:0.85rem;font-weight:600;}
  .live-lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;background:rgba(0,0,0,0.14);margin-bottom:8px;}
  .live-lb-rank{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.1rem;color:var(--teal);width:28px;}
  .live-lb-name{flex:1;font-weight:600;}
  .live-lb-score{font-family:'IBM Plex Mono',monospace;font-weight:700;}

  /* Live session — student phone view */
  #screen-live-student .live-s-waiting{text-align:center;padding:40px 10px;}
  .live-s-opt{border-radius:14px;padding:26px 18px;font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:14px;text-align:center;cursor:pointer;}
  .live-s-opt:active{transform:scale(0.97);}
  .live-s-opt.locked{opacity:0.5;pointer-events:none;}
  .live-s-opt.c0{background:#D64545;} .live-s-opt.c1{background:#2F6BD6;} .live-s-opt.c2{background:#D6A02F;} .live-s-opt.c3{background:#2FA35C;}

  /* Custom modal (replaces native alert/confirm) */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,15,13,0.72);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;backdrop-filter:blur(2px);}
  .modal-box{background:linear-gradient(160deg, var(--card-hi), var(--card));border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow-hover);padding:26px 24px;max-width:400px;width:100%;animation:modalIn .2s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-message{font-size:0.98rem;line-height:1.55;margin-bottom:22px;white-space:pre-line;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  /* Screen transitions */
  @keyframes screenIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .screen-enter{animation:screenIn .35s cubic-bezier(.2,.8,.3,1);}

  /* Progress bar (question X of N) */
  .progress-wrap{margin-bottom:14px;}
  .progress-track{height:5px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark));border-radius:4px;transition:width .4s ease;}
  .progress-label{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--ink-soft);margin-top:6px;text-align:right;}

  /* Icons */
  .icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px;flex-shrink:0;}
  .icon-lg{width:22px;height:22px;margin-right:0;}
  .tab .icon, .brand .icon{margin-right:7px;}
  button .icon{margin-right:6px;}

  /* Custom scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:#2A5750;border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--teal-dark);}
  html{scrollbar-width:thin;scrollbar-color:#2A5750 var(--bg);}

  /* Home dashboard */
  .home-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
  .home-stat-box{background:linear-gradient(160deg, var(--card-hi), var(--card));border:1px solid var(--edge);border-radius:14px;padding:18px;box-shadow:var(--shadow-soft);}
  .home-stat-box .icon-lg{color:var(--teal);margin-bottom:8px;}
  .home-stat-box .num{font-family:'IBM Plex Mono',monospace;font-size:1.7rem;font-weight:700;color:var(--teal);}
  .home-stat-box .lbl{font-size:0.75rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
  .home-activity-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--edge);font-size:0.88rem;}
  .home-activity-row:last-child{border-bottom:none;}

  /* Print — certificate-style result */
  @media print{
    body *{visibility:hidden;}
    #screen-test-result, #screen-test-result *,
    .masthead, .masthead *{visibility:visible;}
    .masthead{border-bottom:2px solid #111 !important;margin-bottom:24px;}
    .brand h1, .tagline{color:#111 !important;}
    .mode-badge{display:none;}
    #screen-test-result{position:absolute;top:70px;left:0;width:100%;padding:40px;background:#fff !important;color:#111 !important;}
    #screen-test-result button{display:none;}
    .stamp{border-color:#111 !important;color:#111 !important;box-shadow:none !important;}
  }
</style>
</head>
<body>
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="app">

  <div id="screen-join" class="card tilt">

let soundEnabled = true;
function beep(freq, duration, type, vol){
  if(!soundEnabled) return;
  try{
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext||window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }catch(e){ /* audio unavailable — silently skip, never blocks the app */ }
}

/* Low-level primitives: every real storage call goes through these, so a single
   transient failure (a dropped request, a brief network hiccup) gets retried
   automatically instead of surfacing as an error to the person using the app.
   Backed by Supabase (Postgres) — see SUPABASE_URL / SUPABASE_ANON_KEY below. */
async function storageGet(key){
  for(let attempt=0; attempt<=2; attempt++){
    try{
      const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      return data ? data.value : null;
    }catch(e){
      if(attempt===2) return null;
      await new Promise(res=>setTimeout(res, 350*(attempt+1)));
    }
  }
  return null;
}
async function storageSet(key, value){
  for(let attempt=0; attempt<=2; attempt++){
    try{
      const { error } = await supabaseClient.from('kv_store').upsert({ key, value });
      if(error) throw error;
      return true;
    }catch(e){
      if(attempt===2) return false;
      await new Promise(res=>setTimeout(res, 350*(attempt+1)));
    }
  }
  return false;
}
async function storageDelete(key){
  for(let attempt=0; attempt<=2; attempt++){
    try{
      const { error } = await supabaseClient.from('kv_store').delete().eq('key', key);
      if(error) throw error;
      return true;
    }catch(e){
      if(attempt===2) return false;
      await new Promise(res=>setTimeout(res, 350*(attempt+1)));
    }
  }
  return false;
}
async function storageListKeys(prefix){
  for(let attempt=0; attempt<=2; attempt++){
    try{
      const { data, error } = await supabaseClient.from('kv_store').select('key').like('key', prefix+'%');
      if(error) throw error;
      return (data||[]).map(row=>row.key);
    }catch(e){
      if(attempt===2) return [];
      await new Promise(res=>setTimeout(res, 350*(attempt+1)));
    }
  }
  return [];
}

function toggleGroupUnknown(){
  const checked = document.getElementById('groupUnknownCheckbox').checked;
  const groupInput = document.getElementById('studentGroupInput');
  groupInput.disabled = checked;
  if(checked) groupInput.value = '';

async function handleJoin(){
  const first = document.getElementById('studentFirstNameInput').value.trim();
  const last = document.getElementById('studentLastNameInput').value.trim();
  const groupUnknown = document.getElementById('groupUnknownCheckbox').checked;
  const group = document.getElementById('studentGroupInput').value.trim();

  if(first.length < 3){ await customAlert("Ismingizni to'liq kiriting (kamida 3 ta harf)."); return; }
  if(last.length < 3){ await customAlert("Familiyangizni to'liq kiriting (kamida 3 ta harf)."); return; }
  if(!groupUnknown && group.length===0){ await customAlert("Guruhingizni kiriting, yoki 'Guruhimni hozircha ko'rsata olmayman' belgisini bosing."); return; }

  const fullName = `${first} ${last}`;
  const slug = slugify(fullName);
  state.config = await loadConfig();
  if(state.config.blockedStudents && state.config.blockedStudents.includes(slug)){
    await customAlert("Kirish bloklangan. Iltimos, o'qituvchingiz bilan bog'laning.");
    return;
  }
  state.studentName = fullName;
  state.studentSlug = slug;
  state.studentGroup = groupUnknown ? "Ko'rsatilmagan" : group;
  upsertRosterEntry(slug, fullName, state.studentGroup); // fire-and-forget: keeps the admin's block-list picker in sync

  // Priority 1: a direct single-test link (?test=ID) takes the student straight into that test
  if(state.lockedTestId){
    const t = state.config.tests.find(x=>x.id===state.lockedTestId);
    if(t){ await startTest(state.lockedTestId); return; }
    await customAlert("Bu havoladagi test topilmadi — ehtimol o'chirilgan yoki havola noto'g'ri.");
    // Falls through to Priority 2/3 below, which puts the user on a defined screen
    // (live session join, or the normal test list) instead of leaving them stuck.
  }
  // Priority 2: an active live (Kahoot-style) session locks access to just that session.
  // Multiple channels (e.g. one per group) can run in parallel; auto-match by group,
  // or ask the student to pick if the match is ambiguous.
  const liveJoined = await tryAutoJoinLive();
  if(liveJoined) return;
  // Priority 3: normal self-paced mode — full list of active tests
  await renderTestList();
}
async function tryAutoJoinLive(){
  const channels = await listActiveChannels();
  if(channels.length===0) return false;
  if(channels.length===1){
    const live = await loadLiveSession(channels[0]);
    if(live && live.status && live.status!=='ended'){ await enterLiveStudentFlow(live); return true; }
    return false;
  }
  const groupSlug = slugify(state.studentGroup||'');
  const match = channels.find(c=>c===groupSlug);
  if(match){
    const live = await loadLiveSession(match);
    if(live && live.status && live.status!=='ended'){ await enterLiveStudentFlow(live); return true; }
  }
  await showChannelPicker(channels);
  return true;
}

async function gradeOpenAnswersWithAI(questions, answers){
  if(questions.length===0) return [];
  const items = questions.map((q,qi)=>({
    question: q.text,
    modelAnswer: q.modelAnswer || "(mezon berilmagan, umumiy bilim asosida baholang)",
    studentAnswer: answers[qi] || "(javob berilmagan)"
  }));
  const prompt = `Sen buxgalteriya fanidan imtihon javoblarini baholovchi o'qituvchisan. Quyida ${items.length} ta ochiq savol, ularning namunaviy javobi/mezoni va talabaning haqiqiy javobi berilgan. Har bir savol uchun 0 dan 5 gacha ball qo'y (5 — a'lo, 0 — butunlay noto'g'ri yoki javobsiz) va o'zbek tilida 1-2 gapli qisqa fikr-mulohaza yoz.

FAQAT quyidagi JSON massiv formatida javob ber, boshqa hech qanday matn, izoh yoki markdown belgisi qo'shma:
[{"score": <raqam>, "feedback": "<matn>"}, ...]

Savollar:
${items.map((it,i)=>`${i+1}) Savol: ${it.question}\nMezon: ${it.modelAnswer}\nTalaba javobi: ${it.studentAnswer}`).join('\n\n')}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await response.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = textBlocks.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(cleaned);
  return parsed.map(p=>({ score: Math.max(0,Math.min(5, Number(p.score)||0)), feedback: String(p.feedback||'') }));
}
async function submitExamForGrading(){

  const openSec = ex.sections.find(s=>s.type==='open');
  const mcqSec = ex.sections.find(s=>s.type==='mcq');
  const practicalSec = ex.sections.find(s=>s.type==='practical');

  mcqSec.questions.forEach((q,qi)=>{ if(mcqAnswers[qi]===q.correct) mcqScore++; });

  let practicalScore = 0;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Shuffles question order AND each question's option order per attempt (anti-copying).
// Not used in live sessions, where everyone must see the same order on the shared screen.
function buildShuffledQuestions(questions){
  return shuffleArray(questions).map(q=>{
    const idxOrder = shuffleArray(q.options.map((_,i)=>i));
    return {
      text: q.text,
      timeSeconds: q.timeSeconds,
      options: idxOrder.map(i=>q.options[i]),
      correct: idxOrder.indexOf(q.correct)
    };
  });
}

  if(state.config.blockedStudents && state.config.blockedStudents.includes(state.studentSlug)){
    await customAlert("Kirish bloklangan.");
    return;
  }
  state.currentTestId = testId;
  state.currentQIndex = 0;

  state.shuffledQuestions = buildShuffledQuestions(test.questions);

function renderQuestion(){
  const questions = state.shuffledQuestions;
  const idx = state.currentQIndex;
  const q = questions[idx];
  const timeLimit = q.timeSeconds || 30;
  state.qTimeLimit = timeLimit;
  state.qStartTime = Date.now();

  let html = `<div class="qblock">

    html += `<div class="opt" id="opt-${oi}" onclick="selectAnswer(${oi})">

  });
  html += `</div>`;

  const progressPct = Math.round((idx/questions.length)*100);
  document.getElementById('questionProgressFill').style.width = progressPct+'%';
  document.getElementById('questionProgressLabel').textContent = `${idx+1} / ${questions.length} savol`;
  startQuestionTimer(timeLimit);

function startQuestionTimer(seconds){
  clearInterval(state.qTimer);
  let remaining = seconds;
  updateTimerUI(remaining, seconds);
  state.qTimer = setInterval(()=>{
    remaining -= 1;
    updateTimerUI(remaining, seconds);
    if(remaining<=5 && remaining>0) playTickSound();
    if(remaining<=0){
      clearInterval(state.qTimer);
      if(!state.qLocked) lockAnswer(null);
    }
  }, 1000);
}
function updateTimerUI(remaining, total){
  const pct = Math.max(0, (remaining/total)*100);
  const fill = document.getElementById('timerBarFill');
  const num = document.getElementById('timerNum');
  if(fill){ fill.style.width = pct+'%'; fill.classList.toggle('warn', remaining<=5); }
  if(num) num.textContent = Math.max(0, remaining);
}
function selectAnswer(oIdx){
  if(state.qLocked) return;
  lockAnswer(oIdx);
}
function lockAnswer(oIdx){
  state.qLocked = true;
  clearInterval(state.qTimer);
  const questions = state.shuffledQuestions;
  const idx = state.currentQIndex;
  const q = questions[idx];
  const elapsedMs = Date.now() - state.qStartTime;
  const timeLimitMs = state.qTimeLimit*1000;
  const cappedElapsed = Math.min(elapsedMs, timeLimitMs);
  const isCorrect = oIdx !== null && oIdx === q.correct;
  const answered = oIdx !== null;
  // Kahoot-style speed scoring: 1000 pts for an instant correct answer, decaying to 500 pts
  // at the very last moment; wrong or unanswered scores 0. This is what drives the ranking.
  let points = 0;
  if(isCorrect){
    const remainingFrac = Math.max(0, 1 - (cappedElapsed/timeLimitMs));
    points = Math.round(500 + 500*remainingFrac);
  }
  if(isCorrect) playCorrectSound(); else playWrongSound();
  state.answers.push({
    qIndex: idx, selected: oIdx, isCorrect, answered, timeTakenMs: cappedElapsed, points,
    questionText: q.text, correctText: q.options[q.correct]
  });

  q.options.forEach((_,oi)=>{
    const el = document.getElementById(`opt-${oi}`);
    if(!el) return;
    if(oi===q.correct) el.classList.add('correct');
    else if(oi===oIdx) el.classList.add('wrong');
  });

  setTimeout(()=>{
    if(idx+1 < questions.length){
      state.currentQIndex++;
      renderQuestion();
    } else {
      finishTest();
    }
  }, 900);
}

async function showResult(record){
  window._lastResultRecord = record;
  hideAll();
  showScreen('screen-test-result');
  const low = record.percentage < 60;
  document.getElementById('resultStamp').innerHTML = `
    <div class="stamp ${low?'low':''}">
      <span class="pct">${record.percentage}%</span>
      <span class="lbl">Natija</span>
    </div>`;
  const testForReview = state.config.tests.find(t=>t.id===record.testId);
  let breakdown = '';
  record.detail.forEach((d,i)=>{
    const label = d.isCorrect ? `To'g'ri ✓ (+${d.points} ball)` : (d.answered ? "Xato ✗" : "Vaqt tugadi ✗");
    // Prefer the text captured at answer-time (works even if questions/options were
    // shuffled for this attempt); fall back to a plain lookup for older records.
    const qText = d.questionText || (testForReview && testForReview.questions[d.qIndex] ? testForReview.questions[d.qIndex].text : '');
    const correctText = d.correctText || (testForReview && testForReview.questions[d.qIndex] ? testForReview.questions[d.qIndex].options[testForReview.questions[d.qIndex].correct] : '');
    let correctLine = '';
    if(!d.isCorrect && correctText){
      correctLine = `<div style="font-size:0.85rem;color:var(--ink-soft);margin-top:2px;">To'g'ri javob: <span style="color:var(--teal);font-weight:600;">${escapeHtml(correctText)}</span></div>`;
    }

      <div style="display:flex;justify-content:space-between;gap:10px;">
        <span>${i+1}. ${escapeHtml(qText)}</span>
        <span style="font-weight:600;white-space:nowrap;color:${d.isCorrect? 'var(--teal)':'var(--red)'}">${label}</span>
      </div>
      ${correctLine}
    </div>`;
  });
  let rankLine = '';
  const allResults = await fetchResultsForTest(record.testId);
  if(allResults.length>0){
    const sorted = [...allResults].sort((a,b)=>(b.totalScore||0)-(a.totalScore||0));
    const rank = sorted.findIndex(r => r.studentName===record.studentName && r.timestamp===record.timestamp) + 1;
    if(rank>0){
      rankLine = `<div class="desc" style="margin-top:2px;">Reyting: <strong style="color:var(--teal);">${rank}</strong> / ${sorted.length} ishtirokchi ichida</div>`;
    }
  }
  const certBtn = record.percentage>=80 ? `<button class="btn-owner btn-small" onclick="generateCertificatePDF()">${icon('download')}Sertifikatni yuklab olish</button>` : '';
  document.getElementById('resultBody').innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div class="lead" style="margin-bottom:4px;">${escapeHtml(record.topic)}</div>
      <div class="desc" style="margin:0;">${record.score} / ${record.total} ta savolga to'g'ri javob berdingiz</div>
      <div class="desc" style="margin:4px 0 0;">Umumiy ball: <strong style="color:var(--teal);">${record.totalScore}</strong> / ${record.maxScore}</div>
      ${rankLine}
      ${certBtn ? `<div style="margin-top:14px;">${certBtn}</div>` : ''}
    </div>
    ${breakdown}
  `;
}

async function enterLiveStudentFlow(live){
  clearInterval(state.livePollTimer);
  state.liveSessionId = live.sessionId;
  state.liveChannel = live.channel;
  state.liveRenderedKey = null;
  state.liveAnswered = false;
  await joinLiveSession(live.sessionId, state.studentSlug, state.studentName, state.studentGroup);
  hideAll();
  showScreen('screen-live-student');
  document.getElementById('masthead-sub').textContent = "Jonli seans";
  await liveStudentTick();
  state.livePollTimer = setInterval(liveStudentTick, 2500);
}
async function liveStudentTick(){
  const live = await loadLiveSession(state.liveChannel);
  if(!live || live.sessionId !== state.liveSessionId){
    clearInterval(state.livePollTimer);
    renderLiveStudentEndedFallback();
    return;
  }
  if(live.status === 'ended'){
    clearInterval(state.livePollTimer);
    await finalizeLiveResultForStudent(live);
    return;
  }
  const key = `${live.status}:${live.qIndex}`;
  if(key !== state.liveRenderedKey){
    state.liveRenderedKey = key;
    state.liveAnswered = false;
    if(live.status==='lobby') renderLiveStudentLobby();
    else if(live.status==='countdown') renderLiveStudentCountdown(live);
    else if(live.status==='question') renderLiveStudentQuestion(live);
    else if(live.status==='reveal') await renderLiveStudentReveal(live);
  } else if(live.status==='countdown'){
    updateLiveStudentCountdownUI(live);
  } else if(live.status==='question' && !state.liveAnswered){
    updateLiveStudentTimerUI(live);
  }
}
function renderLiveStudentLobby(){
  document.getElementById('liveStudentBody').innerHTML = `
    <div class="live-s-waiting">

}
function renderLiveStudentCountdown(live){
  document.getElementById('liveStudentBody').innerHTML = `

      <div class="live-big-timer" id="liveStudentCountdownNum" style="font-size:4.5rem;">3</div>

}
function updateLiveStudentCountdownUI(live){
  const elapsed = (Date.now() - (live.countdownStartedAt||Date.now()))/1000;
  const remaining = Math.max(0, Math.ceil(3 - elapsed));
  const el = document.getElementById('liveStudentCountdownNum');
  if(el) el.textContent = remaining>0 ? remaining : "Boshlandi!";
}
function renderLiveStudentQuestion(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const q = test.questions[live.qIndex];
  const letters = ['A','B','C','D'];
  let html = `
    <div class="timer-wrap"><div class="timer-bar-track"><div class="timer-bar-fill" id="liveTimerFill"></div></div><div class="timer-num" id="liveTimerNum">${q.timeSeconds||30}</div></div>

    <div class="qtext" style="text-align:center;font-size:1.1rem;margin-bottom:18px;">${escapeHtml(q.text)}</div>`;
  q.options.forEach((opt,oi)=>{
    html += `<div class="live-s-opt c${oi%4}" id="liveopt-${oi}" onclick="handleLiveAnswerTap(${oi})">${letters[oi]}) ${escapeHtml(opt)}</div>`;
  });
  document.getElementById('liveStudentBody').innerHTML = html;
}
function updateLiveStudentTimerUI(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const q = test.questions[live.qIndex];
  const total = q.timeSeconds || 30;
  const elapsed = (Date.now() - (live.questionStartedAt||Date.now()))/1000;
  const remaining = Math.max(0, Math.ceil(total - elapsed));
  const pct = Math.max(0,(remaining/total)*100);
  const fill = document.getElementById('liveTimerFill');
  const num = document.getElementById('liveTimerNum');
  if(fill){ fill.style.width = pct+'%'; fill.classList.toggle('warn', remaining<=5); }
  if(num) num.textContent = remaining;
  if(remaining<=0 && !state.liveAnswered){
    state.liveAnswered = true;
    document.querySelectorAll('.live-s-opt').forEach(el=>el.classList.add('locked'));
  }
}
async function handleLiveAnswerTap(oIdx){
  if(state.liveAnswered) return;
  state.liveAnswered = true;
  document.querySelectorAll('.live-s-opt').forEach(el=>el.classList.add('locked'));
  const live = await loadLiveSession(state.liveChannel);
  if(!live || live.status!=='question'){ return; }
  const test = state.config.tests.find(t=>t.id===live.testId);
  const q = test.questions[live.qIndex];
  const timeLimitMs = (q.timeSeconds||30)*1000;
  const elapsed = Math.min(Date.now() - (live.questionStartedAt||Date.now()), timeLimitMs);
  const isCorrect = oIdx === q.correct;
  let points = 0;
  if(isCorrect){
    const remainingFrac = Math.max(0, 1 - (elapsed/timeLimitMs));
    points = Math.round(500 + 500*remainingFrac);
  }
  await saveLiveAnswer(live.sessionId, live.qIndex, state.studentSlug, {
    qIndex: live.qIndex, selected: oIdx, isCorrect, answered:true, timeTakenMs: elapsed, points
  });
  document.getElementById('liveStudentBody').innerHTML = `
    <div class="live-s-waiting">
      <div class="lead">Javobingiz qabul qilindi ✓</div>
      <p class="desc">Natijalar ko'rsatilishini kuting...</p>
    </div>`;
}
async function renderLiveStudentReveal(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const q = test.questions[live.qIndex];
  const myAnswer = await getLiveAnswer(live.sessionId, live.qIndex, state.studentSlug);
  const isLast = live.qIndex === test.questions.length-1;
  let html;
  if(myAnswer && myAnswer.isCorrect){
    playCorrectSound();
    html = `<div class="live-s-waiting"><div class="stamp"><span class="pct">+${myAnswer.points}</span><span class="lbl">Ball</span></div><div class="lead">To'g'ri! ✓</div></div>`;
  } else {
    playWrongSound();
    html = `<div class="live-s-waiting"><div class="stamp low"><span class="pct">0</span><span class="lbl">Ball</span></div><div class="lead">Afsuski, xato ✗</div><p class="desc">To'g'ri javob: ${escapeHtml(q.options[q.correct])}</p></div>`;
  }
  html += `<p class="desc" style="text-align:center;">${isLast? "Yakuniy natijalarni kuting..." : "Keyingi savolni kuting..."}</p>`;
  document.getElementById('liveStudentBody').innerHTML = html;
}
function renderLiveStudentEndedFallback(){
  document.getElementById('liveStudentBody').innerHTML = `<div class="live-s-waiting"><div class="lead">Seans yakunlandi</div><button class="btn-primary" onclick="renderTestList()">Testlar ro'yxatiga qaytish</button></div>`;
}
async function finalizeLiveResultForStudent(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const existing = await getResult(test.id, state.studentSlug);
  if(existing){ await showResult(existing); return; }
  const detail = [];
  for(let i=0;i<test.questions.length;i++){
    const a = await getLiveAnswer(live.sessionId, i, state.studentSlug);
    detail.push(a || {qIndex:i, selected:null, isCorrect:false, answered:false, timeTakenMs:0, points:0});
  }
  const correctCount = detail.filter(d=>d.isCorrect).length;
  const totalScore = detail.reduce((a,b)=>a+(b.points||0),0);
  const percentage = Math.round((correctCount/test.questions.length)*100);
  const record = {
    studentName: state.studentName,
    studentGroup: state.studentGroup,
    testId: test.id,
    topic: test.topic,
    title: test.title,
    score: correctCount,
    total: test.questions.length,
    percentage,
    totalScore,
    maxScore: test.questions.length*1000,
    timestamp: new Date().toISOString(),
    detail
  };
  await saveResult(test.id, state.studentSlug, record);
  await showResult(record);
}

/* ============ EXAM MODULE — AUTO-GENERATE QUESTIONS FROM UPLOADED DOCUMENT ============ */
async function handleExamDocUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('examDocStatus');
  statusEl.innerHTML = `<div class="loading">Hujjat o'qilmoqda...</div>`;
  try{
    const ext = file.name.toLowerCase().split('.').pop();
    let text = '';
    if(ext==='pdf') text = await extractTextFromPdf(file);
    else if(ext==='docx') text = await extractTextFromDocx(file);
    else text = await file.text();

    if(!text || !text.trim()){
      statusEl.innerHTML = `<div style="color:var(--red);">Hujjatdan matn topilmadi. Fayl skanerlangan rasm bo'lishi mumkin — bunday holatda matn avtomatik o'qilmaydi.</div>`;
      return;
    }
    statusEl.innerHTML = `<div class="loading">AI savollarni ajratmoqda...</div>`;
    const parsed = await generateExamQuestionsFromText(text);
    mergeGeneratedQuestionsIntoDraft(parsed);
    statusEl.innerHTML = `<div style="color:var(--teal);">${parsed.open.length} ta ochiq savol, ${parsed.mcq.length} ta test savoli, ${parsed.practical.length} ta amaliy operatsiya qo'shildi. Iltimos, to'g'ri javoblarni (test varianti, Dt/Kt) pastda tekshirib, to'ldiring.</div>`;
    showToast("Savollar generatsiya qilindi ✓ — to'g'ri javoblarni tekshiring");
    evt.target.value = '';
    renderExamEditorForm();
  }catch(e){
    statusEl.innerHTML = `<div style="color:var(--red);">Xatolik: ${escapeHtml(e.message||'hujjatni qayta ishlashda muammo yuz berdi')}.</div>`;
  }
}
async function extractTextFromPdf(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
async function extractTextFromDocx(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  return result.value;
}
async function generateExamQuestionsFromText(rawText){
  const trimmed = rawText.slice(0, 15000); // keep prompt reasonable
  const prompt = `Sen buxgalteriya fanidan imtihon hujjatini tahlil qiluvchi yordamchisan. Quyida imtihon hujjatining matni berilgan. Undan uchta toifadagi savollarni ajratib ol:
1) "open" — ochiq (yozma) savollar, faqat savol matni
2) "mcq" — test savollari (bir nechta variantli), savol matni va barcha variantlar (odatda a) b) v) g) yoki A) B) C) D) bilan belgilangan)
3) "practical" — amaliy xo'jalik operatsiyalari (provodka tuzish uchun), faqat operatsiya matni (summasi bilan, agar bo'lsa)

FAQAT quyidagi JSON formatida javob ber, boshqa hech qanday matn yoki markdown belgisi qo'shma:
{"open":[{"text":"..."}],"mcq":[{"text":"...","options":["...","...","...","..."]}],"practical":[{"text":"..."}]}

Agar biror toifada savol topilmasa, bo'sh massiv qaytar. Hujjat matni:
${trimmed}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await response.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = textBlocks.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(cleaned);
  return {
    open: Array.isArray(parsed.open) ? parsed.open : [],
    mcq: Array.isArray(parsed.mcq) ? parsed.mcq : [],
    practical: Array.isArray(parsed.practical) ? parsed.practical : []
  };
}
function mergeGeneratedQuestionsIntoDraft(parsed){
  const d = window._draftExam;
  const openSec = d.sections.find(s=>s.type==='open');
  const mcqSec = d.sections.find(s=>s.type==='mcq');
  const practicalSec = d.sections.find(s=>s.type==='practical');
  const isBlankStub = (qs) => qs.length===1 && !qs[0].text.trim();

  if(parsed.open.length>0){
    const newOnes = parsed.open.map(q=>({text: q.text||'', modelAnswer:''}));
    openSec.questions = isBlankStub(openSec.questions) ? newOnes : openSec.questions.concat(newOnes);
  }
  if(parsed.mcq.length>0){
    const newOnes = parsed.mcq.map(q=>{
      let opts = (q.options && q.options.length>0) ? q.options.slice(0,4) : [];
      while(opts.length<4) opts.push('');
      return {text: q.text||'', options: opts, correct:0};
    });
    mcqSec.questions = isBlankStub(mcqSec.questions) ? newOnes : mcqSec.questions.concat(newOnes);
  }
  if(parsed.practical.length>0){
    const newOnes = parsed.practical.map(q=>({text: q.text||'', correctDt:'', correctKt:''}));
    practicalSec.questions = isBlankStub(practicalSec.questions) ? newOnes : practicalSec.questions.concat(newOnes);
  }
}

async function saveDraftExam(){
  const d = window._draftExam;
  if(!d.title.trim()){ await customAlert("Imtihon nomini kiriting."); return; }
  for(const sec of d.sections){
    for(const q of sec.questions){
      if(!q.text.trim()){ await customAlert(`"${sec.title}" bo'limida bo'sh savol bor.`); return; }
      if(sec.type==='mcq' && q.options.some(o=>!o.trim())){ await customAlert("Test bo'limida barcha variantlarni to'ldiring."); return; }
      if(sec.type==='practical' && (!/^\d{4}$/.test(q.correctDt) || !/^\d{4}$/.test(q.correctKt))){ await customAlert("Amaliy bo'limda Dt va Kt 4 xonali raqam bo'lishi kerak."); return; }
    }
  }
  const saveBtn = document.getElementById('saveExamBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saqlanmoqda...'; }
  const backup = state.examConfig.exams.slice();
  const idx = state.examConfig.exams.findIndex(e=>e.id===d.id);
  if(idx>=0) state.examConfig.exams[idx] = d; else state.examConfig.exams.push(d);
  const ok = await saveExamConfig(state.examConfig);
  if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Saqlash'; }
  if(!ok){ state.examConfig.exams = backup; return; }
  showToast("Imtihon saqlandi ✓");
  state.editingExamId = null;
  window._draftExam = null;
  state.examsSubTab = 'list';
  renderAdminExams();
}

  state.editingExamId = null;
  window._draftExam = null;
  state.examsSubTab = 'list';
  renderAdminExams();
}

  if(!(await customConfirm("Ushbu testni o'chirishni tasdiqlaysizmi? Bu amalni orqaga qaytarib bo'lmaydi."))) return;
  const backup = state.config.tests;
  state.config.tests = state.config.tests.filter(t=>t.id!==id);
  const ok = await saveConfig(state.config);
  if(ok) showToast("Test o'chirildi ✓");
  else state.config.tests = backup;
  renderAdminTests();
}
function openTestEditor(id){
  state.editingTestId = id;
  state.testsSubTab = 'create';
  const existing = id ? state.config.tests.find(t=>t.id===id) : null;
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: 'test_' + Date.now(),
    topic: '', title: '', active: true,
    questions: [{text:'', options:['','','',''], correct:0, timeSeconds:30}]
  };
  draft.questions.forEach(q=>{ if(!q.timeSeconds) q.timeSeconds = 30; });
  window._draftTest = draft;
  renderAdminTests();
  renderTestEditorForm();
}

  });

    <div class="card" style="margin-top:10px;">
      <div class="lead" style="margin-bottom:16px;">${!state.editingTestId? 'Yangi test yaratish':'Testni tahrirlash'}</div>
      <div class="flexrow">

        </div>
        <div class="field">
          <label>Sarlavha (ixtiyoriy)</label>
          <input type="text" id="draftTitle" value="${escapeAttr(d.title)}" placeholder="Masalan: 1-nazorat testi">
        </div>
      </div>
      <p class="desc" style="margin-top:-8px;">Har bir savol uchun standart vaqt 30 soniya — murakkab savollarga ko'proq vaqt belgilashingiz mumkin.</p>
      <div style="margin:14px 0;">${qHtml}</div>
      <button class="btn-ghost btn-small" onclick="addDraftQuestion()">+ Savol qo'shish</button>
      <div style="margin-top:20px;display:flex;gap:10px;">
        <button class="btn-primary" id="saveTestBtn" onclick="saveDraftTest()">Saqlash</button>

      </div>
    </div>`;
  document.getElementById('testEditorHolder').innerHTML = html;

function setDraftQuestionText(qi,val){ window._draftTest.questions[qi].text = val; }
function setDraftOption(qi,oi,val){ window._draftTest.questions[qi].options[oi] = val; }
function setDraftCorrect(qi,oi){ window._draftTest.questions[qi].correct = oi; }
function setDraftTime(qi,val){
  const n = parseInt(val,10);
  window._draftTest.questions[qi].timeSeconds = (isNaN(n) || n<5) ? 5 : Math.min(n,300);
}
function applyTimeToAll(){
  const t = window._draftTest.questions[0].timeSeconds;
  window._draftTest.questions.forEach(q=> q.timeSeconds = t);
  renderTestEditorForm();
  showToast(`Barcha savollarga ${t} soniya belgilandi ✓`);
}
function addDraftQuestion(){
  window._draftTest.questions.push({text:'', options:['','','',''], correct:0, timeSeconds:30});
  renderTestEditorForm();
}
async function removeDraftQuestion(qi){
  if(window._draftTest.questions.length<=1){ await customAlert("Kamida bitta savol bo'lishi kerak."); return; }
  window._draftTest.questions.splice(qi,1);
  renderTestEditorForm();
}
async function saveDraftTest(){
  const d = window._draftTest;
  if(!d.topic.trim()){ await customAlert("Mavzuni kiriting."); return; }
  for(const q of d.questions){
    if(!q.text.trim() || q.options.some(o=>!o.trim())){
      await customAlert("Barcha savol va variant matnlarini to'ldiring.");
      return;
    }
  }
  const saveBtn = document.getElementById('saveTestBtn');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Saqlanmoqda...'; }
  const backup = state.config.tests.slice();
  const existingIdx = state.config.tests.findIndex(t=>t.id===d.id);
  if(existingIdx>=0) state.config.tests[existingIdx] = d;
  else state.config.tests.push(d);
  const ok = await saveConfig(state.config);
  if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Saqlash'; }
  if(!ok){ state.config.tests = backup; return; } // saveConfig already showed the error toast; keep editor open so nothing is lost
  showToast("Test saqlandi ✓");
  state.editingTestId = null;
  window._draftTest = null;
  state.testsSubTab = 'list';
  renderAdminTests();
}
function cancelDraftTest(){
  state.editingTestId = null;
  window._draftTest = null;
  state.testsSubTab = 'list';
  renderAdminTests();
}

function handleExcelImport(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('excelImportStatus');
  statusEl.innerHTML = `<div class="loading">Fayl o'qilmoqda...</div>`;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const {tests, skipped, mode} = parseTestSheet(sheet);
      if(tests.length===0){
        statusEl.innerHTML = `<div style="color:var(--red);">Hech qanday to'g'ri qatorni topa olmadim. Har bir qatorda: Mavzu, Savol, kamida 2 ta variant, va to'g'ri javob (1-4 yoki A-D) bo'lishi kerak. Aniq shablon uchun "Excel shablonini yuklab olish" tugmasidan foydalaning. ${skipped>0?`(${skipped} ta qator o'tkazib yuborildi)`:''}</div>`;
        return;
      }
      state.config.tests.push(...tests);
      const ok = await saveConfig(state.config);
      if(!ok){
        state.config.tests = state.config.tests.slice(0, state.config.tests.length - tests.length);
        statusEl.innerHTML = `<div style="color:var(--red);">Saqlashda xatolik yuz berdi, qayta urinib ko'ring.</div>`;
        return;
      }
      const modeNote = mode==='positional' ? " (ustun nomlari mos kelmagani uchun, shablon tartibi bo'yicha o'qildi: Mavzu, Sarlavha, Savol, Variant1-4, To'g'ri javob, Vaqt)" : "";
      statusEl.innerHTML = `<div style="color:var(--teal);">${tests.length} ta test qo'shildi (${tests.reduce((a,t)=>a+t.questions.length,0)} ta savol)${modeNote}. ${skipped>0?`${skipped} ta qator o'tkazib yuborildi (to'liq emas edi).`:''} Testlar ro'yxatida "Yopiq" holatda — tekshirib, "Ochish" tugmasi orqali faollashtiring.</div>`;
      showToast(`${tests.length} ta test import qilindi ✓`);
      evt.target.value = '';
      renderAdminTests();
    }catch(err){
      statusEl.innerHTML = `<div style="color:var(--red);">Faylni o'qishda xatolik: ${escapeHtml(err.message)}. Fayl .xlsx yoki .csv formatida ekanligiga ishonch hosil qiling.</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
// Accepts the correct-answer cell as a number (1-4) or a letter (A-D), in any case/spacing.
function parseCorrectAnswer(raw, optionCount){
  const s = String(raw==null?'':raw).trim().toUpperCase();
  if(/^[1-9][0-9]*$/.test(s)){
    const n = parseInt(s,10);
    return (n>=1 && n<=optionCount) ? n : null;
  }
  if(/^[A-D]$/.test(s)){
    const n = s.charCodeAt(0)-64;
    return (n>=1 && n<=optionCount) ? n : null;
  }
  return null;
}
function makeTestGroupKey(groups, topic, title){
  const key = topic+'|||'+title;
  if(!groups[key]) groups[key] = {id:'test_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), topic, title, active:false, questions:[]};
  return groups[key];
}
// Tries named-column matching first (works with the template, and with reasonable
// header variations like "Togri javob", "Variant 1", "Javob"). If the sheet's header
// row doesn't contain recognizable Mavzu/Savol columns at all, falls back to reading
// columns purely by position (Mavzu, Sarlavha, Savol, Variant1-4, To'g'ri, Vaqt) —
// so a file with renamed or translated headers still imports correctly.
function parseTestSheet(sheet){
  const norm = s => String(s||'').trim().toLowerCase().replace(/[^a-z0-9а-яёʻ]/gi,'');
  const jsonRows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  let headerLooksNamed = false;
  if(jsonRows.length>0){
    const normKeys = Object.keys(jsonRows[0]).map(norm);
    headerLooksNamed = normKeys.some(k=>k.startsWith('mavzu')) && normKeys.some(k=>k.startsWith('savol'));
  }
  if(headerLooksNamed){
    const result = parseNamedRows(jsonRows, norm);
    if(result.tests.length>0) return {...result, mode:'named'};
  }
  // Fallback to strict positional reading (skip the first row as the header)
  const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  const dataRows = aoa.slice(1);
  return {...parsePositionalRows(dataRows), mode:'positional'};
}
function parseNamedRows(rows, norm){
  const groups = {};
  let skipped = 0;
  rows.forEach(row=>{
    const keys = {};
    Object.keys(row).forEach(k=> keys[norm(k)] = row[k]);
    const mavzuKey = Object.keys(keys).find(k=>k.startsWith('mavzu'));
    const savolKey = Object.keys(keys).find(k=>k.startsWith('savol'));
    const sarlavhaKey = Object.keys(keys).find(k=>k.startsWith('sarlavha'));
    const mavzu = mavzuKey ? String(keys[mavzuKey]).trim() : '';
    const sarlavha = sarlavhaKey ? String(keys[sarlavhaKey]).trim() : '';
    const savol = savolKey ? String(keys[savolKey]).trim() : '';
    // Any column named variant1/variant2/... (or opt1, option1) counts as an answer option,
    // in numeric order — this tolerates renamed or reordered variant columns.
    let variantKeys = Object.keys(keys)
      .filter(k => /^(variant|opt|option)[0-9]+$/.test(k))
      .sort((a,b)=> parseInt(a.match(/[0-9]+$/)[0],10) - parseInt(b.match(/[0-9]+$/)[0],10));
    let options = variantKeys.map(k=>String(keys[k]||'').trim()).filter(v=>v!=='');
    if(options.length===0){
      options = ['variant1','variant2','variant3','variant4'].map(k=>String(keys[k]||'').trim()).filter(v=>v!=='');
    }
    const correctKey = Object.keys(keys).find(k => k.startsWith('togri') || k.startsWith('correct') || k==='javob');
    const vaqtKey = Object.keys(keys).find(k => k.startsWith('vaqt') || k.startsWith('time'));
    const correctNum = parseCorrectAnswer(correctKey ? keys[correctKey] : '', options.length);
    const vaqtNum = vaqtKey ? parseInt(keys[vaqtKey],10) : NaN;
    const timeSeconds = (!isNaN(vaqtNum) && vaqtNum>=5) ? Math.min(vaqtNum,300) : 30;
    if(!mavzu || !savol || options.length<2 || !correctNum){ skipped++; return; }
    makeTestGroupKey(groups, mavzu, sarlavha).questions.push({text:savol, options, correct:correctNum-1, timeSeconds});
  });
  return {tests: Object.values(groups), skipped};
}
function parsePositionalRows(rows){
  const groups = {};
  let skipped = 0;
  rows.forEach(r=>{
    if(!r || r.length===0 || r.every(c=>String(c||'').trim()==='')) return; // skip blank rows silently
    const mavzu = String(r[0]||'').trim();
    const sarlavha = String(r[1]||'').trim();
    const savol = String(r[2]||'').trim();
    const options = [r[3],r[4],r[5],r[6]].map(v=>String(v||'').trim()).filter(v=>v!=='');
    const correctNum = parseCorrectAnswer(r[7], options.length);
    const vaqtNum = parseInt(r[8],10);
    const timeSeconds = (!isNaN(vaqtNum) && vaqtNum>=5) ? Math.min(vaqtNum,300) : 30;
    if(!mavzu || !savol || options.length<2 || !correctNum){ skipped++; return; }
    makeTestGroupKey(groups, mavzu, sarlavha).questions.push({text:savol, options, correct:correctNum-1, timeSeconds});
  });
  return {tests: Object.values(groups), skipped};
}
function handleTextImport(){
  const raw = document.getElementById('textImportArea').value;
  const statusEl = document.getElementById('textImportStatus');
  if(!raw.trim()){ statusEl.innerHTML = `<div style="color:var(--red);">Matn kiritilmagan.</div>`; return; }
  try{
    const tests = parseTextFormat(raw);
    if(tests.length===0){
      statusEl.innerHTML = `<div style="color:var(--red);">Formatga mos test topilmadi. Namunaga qarab qayta urinib ko'ring.</div>`;
      return;
    }
    state.config.tests.push(...tests);
    saveConfig(state.config).then((ok)=>{
      if(!ok){
        state.config.tests = state.config.tests.slice(0, state.config.tests.length - tests.length);
        statusEl.innerHTML = `<div style="color:var(--red);">Saqlashda xatolik yuz berdi, qayta urinib ko'ring.</div>`;
        return;
      }
      statusEl.innerHTML = `<div style="color:var(--teal);">${tests.length} ta test qo'shildi (${tests.reduce((a,t)=>a+t.questions.length,0)} ta savol). Ro'yxatda "Yopiq" holatda — tekshirib, faollashtiring.</div>`;
      showToast(`${tests.length} ta test import qilindi ✓`);
      document.getElementById('textImportArea').value='';
      renderAdminTests();
    });
  }catch(err){
    statusEl.innerHTML = `<div style="color:var(--red);">Xatolik: ${escapeHtml(err.message)}</div>`;
  }
}
function parseTextFormat(raw){
  const tests = [];
  const blocks = raw.split(/^(?=#?\s*MAVZU\s*:)/im).map(b=>b.trim()).filter(Boolean);
  blocks.forEach(block=>{
    const topicMatch = block.match(/#?\s*MAVZU\s*:\s*(.+)/i);
    if(!topicMatch) return;
    const topic = topicMatch[1].trim();
    const titleMatch = block.match(/#?\s*TEST\s*:\s*(.+)/i);
    const title = titleMatch ? titleMatch[1].trim() : '';
    const body = block.replace(/#?\s*MAVZU\s*:.*(\r?\n)?/i,'').replace(/#?\s*TEST\s*:.*(\r?\n)?/i,'');
    const qChunks = body.split(/(?=^\s*\d+[\.\)]\s)/m).map(c=>c.trim()).filter(Boolean);
    const questions = [];
    qChunks.forEach(chunk=>{
      const lines = chunk.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      if(lines.length<3) return;
      const qText = lines[0].replace(/^\d+[\.\)]\s*/,'').trim();
      const options = [];
      let correctIdx = null;
      let timeSeconds = 30;
      lines.slice(1).forEach(line=>{
        const optMatch = line.match(/^([A-D])[\.\)\-]\s*(.+)/i);
        const ansMatch = line.match(/^(to'?g'?ri\s+)?javob\s*[:\-]?\s*([A-D1-4])/i);
        const timeMatch = line.match(/^vaqt\s*[:\-]?\s*(\d+)/i);
        if(ansMatch){
          const raw2 = ansMatch[2].toUpperCase();
          correctIdx = /[1-4]/.test(raw2) ? (parseInt(raw2,10)-1) : (raw2.charCodeAt(0)-65);
        } else if(timeMatch){
          const n = parseInt(timeMatch[1],10);
          if(!isNaN(n) && n>=5) timeSeconds = Math.min(n,300);
        } else if(optMatch){
          options.push(optMatch[2].trim());
        }
      });
      if(qText && options.length>=2 && correctIdx!==null && correctIdx<options.length){
        questions.push({text:qText, options, correct:correctIdx, timeSeconds});
      }
    });
    if(questions.length>0){
      tests.push({id:'test_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), topic, title, active:false, questions});
    }
  });
  return tests;
}

function copyDirectLink(testId){
  const url = `${window.location.origin}${window.location.pathname}?test=${testId}`;

/* --- Live (Kahoot-style) session — HOST controller --- */
async function startLiveSession(testId){
  const test = state.config.tests.find(t=>t.id===testId);
  if(!test || test.questions.length===0){ showToast("Testda savol yo'q.", true); return; }
  const channelRaw = await customPromptText("Kanal nomi (masalan guruh nomi) — bir nechta guruh bir vaqtda alohida seans o'tkazishi uchun:", test.topic);
  if(channelRaw===null) return; // cancelled
  const channel = slugify(channelRaw || 'asosiy');
  const existingActive = await loadLiveSession(channel);
  if(existingActive && existingActive.status && existingActive.status!=='ended'){
    if(!(await customConfirm(`"${channel}" kanalida allaqachon faol seans bor. Uni yangisi bilan almashtirasizmi?`))) return;
  }
  const sessionId = 'live_'+Date.now();
  const ok = await saveLiveSession(channel, { testId, status:'lobby', qIndex:-1, questionStartedAt:null, sessionId, channel });
  if(!ok){ showToast("Jonli seansni boshlashda xatolik.", true); return; }
  await storageSet(`live-channel-active:${channel}`, JSON.stringify({channel, testId, ts:Date.now()}));
  state.hostSessionId = sessionId;
  state.hostChannel = channel;
  state.hostAutoRevealedQIndex = null;
  state.hostRenderedRevealKey = null;
  openLiveHostView();
}
function openLiveHostView(){
  clearInterval(state.livePollTimer);
  hideAll();
  showScreen('screen-live-host');
  document.getElementById('masthead-sub').textContent = "Jonli seans — Host";
  liveHostTick();
  state.livePollTimer = setInterval(liveHostTick, 3000);
}
async function liveHostTick(){
  const live = await loadLiveSession(state.hostChannel);
  if(!live || live.sessionId !== state.hostSessionId){ return; }
  if(live.status==='lobby') await renderLiveHostLobby(live);
  else if(live.status==='question') await renderLiveHostQuestion(live);
  else if(live.status==='reveal'){
    const key = `reveal:${live.qIndex}`;
    if(state.hostRenderedRevealKey !== key){
      state.hostRenderedRevealKey = key;
      await renderLiveHostReveal(live);
    }
  }
  // 'countdown' is intentionally not handled here — runHostCountdown() owns that transition on its own fast timer
}
async function renderLiveHostLobby(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const players = await listLivePlayers(live.sessionId);
  const joinUrl = `${window.location.origin}${window.location.pathname}`;
  document.getElementById('liveHostBody').innerHTML = `
    <div class="lead" style="text-align:center;margin-bottom:2px;">${escapeHtml(test.topic)}</div>
    <p class="desc" style="text-align:center;margin-bottom:10px;">Kanal: <strong style="color:var(--teal);">${escapeHtml(live.channel||'asosiy')}</strong></p>
    <p class="desc" style="text-align:center;">Telefon kamerasi bilan QR-kodni skanerlang, yoki havolani bosing/nusxalang:</p>
    <p style="text-align:center;margin:6px 0 4px;">
      <a href="${escapeAttr(joinUrl)}" target="_blank" style="color:var(--teal);font-weight:600;word-break:break-all;">${escapeHtml(joinUrl)}</a>
    </p>
    <div style="text-align:center;margin-bottom:14px;">
      <button class="btn-ghost btn-small" onclick="copyJoinUrl('${escapeAttr(joinUrl)}')">Havolani nusxalash</button>

function copyJoinUrl(url){

async function renderLiveHostQuestion(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const q = test.questions[live.qIndex];
  const total = q.timeSeconds||30;
  const elapsed = (Date.now() - (live.questionStartedAt||Date.now()))/1000;
  const remaining = Math.max(0, Math.ceil(total - elapsed));
  const answerCount = await countLiveAnswersForQuestion(live.sessionId, live.qIndex);
  const playerCount = await countLivePlayers(live.sessionId);

  // Auto-reveal as soon as every joined player has answered — saves the host a click
  if(playerCount>0 && answerCount>=playerCount && state.hostAutoRevealedQIndex !== live.qIndex){
    state.hostAutoRevealedQIndex = live.qIndex;
    await hostRevealAnswer();
    return;
  }

  const letters = ['A','B','C','D'];
  let optHtml = '';
  q.options.forEach((opt,oi)=>{
    optHtml += `<div class="live-opt c${oi%4}"><span class="letter">${letters[oi]}</span><span>${escapeHtml(opt)}</span></div>`;
  });
  document.getElementById('liveHostBody').innerHTML = `
    <div class="desc" style="text-align:center;">Savol ${live.qIndex+1} / ${test.questions.length} · Javob berdi: ${answerCount}/${playerCount}</div>
    <div class="live-big-timer">${remaining}</div>
    <div class="live-big-q">${escapeHtml(q.text)}</div>
    <div class="live-opt-grid">${optHtml}</div>
    <div style="text-align:center;margin-top:24px;">
      <button class="btn-owner" onclick="hostRevealAnswer()">Javobni ko'rsatish</button>
    </div>`;
}
async function hostAdvanceQuestion(qIndex){
  const live = await loadLiveSession(state.hostChannel);
  if(!live) return;
  state.hostAutoRevealedQIndex = null;
  await saveLiveSession(state.hostChannel, {...live, status:'countdown', qIndex, countdownStartedAt: Date.now()});
  runHostCountdown();
}
function runHostCountdown(){
  clearInterval(state.livePollTimer); // pause the regular poll loop so it can't fight the countdown's own render
  const mySessionId = state.hostSessionId;
  let remaining = 3;
  const render = ()=>{
    document.getElementById('liveHostBody').innerHTML = `
      <div style="text-align:center;padding:70px 0;">
        <div class="live-big-timer" style="font-size:7rem;">${remaining}</div>
        <p class="desc">Tayyorlaning...</p>
      </div>`;
  };
  render();
  const iv = setInterval(async ()=>{
    if(state.hostSessionId !== mySessionId){ clearInterval(iv); return; }
    remaining--;
    if(remaining<=0){
      clearInterval(iv);
      const live = await loadLiveSession(state.hostChannel);
      if(live) await saveLiveSession(state.hostChannel, {...live, status:'question', questionStartedAt: Date.now()});
      state.livePollTimer = setInterval(liveHostTick, 3000);
      liveHostTick();
    } else {
      render();
    }
  }, 1000);
}
async function hostRevealAnswer(){
  const live = await loadLiveSession(state.hostChannel);
  if(!live) return;
  await saveLiveSession(state.hostChannel, {...live, status:'reveal'});
  liveHostTick();
}
async function renderLiveHostReveal(live){
  const test = state.config.tests.find(t=>t.id===live.testId);
  const q = test.questions[live.qIndex];
  const answers = await listLiveAnswersForQuestion(live.sessionId, live.qIndex);
  const letters = ['A','B','C','D'];
  const counts = q.options.map((_,oi)=> answers.filter(a=>a.selected===oi).length);
  let optHtml = '';
  q.options.forEach((opt,oi)=>{
    const correctCls = oi===q.correct ? 'revealed-correct' : 'revealed-wrong';
    optHtml += `<div class="live-opt c${oi%4} ${correctCls}"><span class="letter">${letters[oi]}</span><span>${escapeHtml(opt)} — ${counts[oi]} ta ovoz</span></div>`;
  });
  const players = await listLivePlayers(live.sessionId);
  const leaderboard = await computeCumulativeLeaderboard(live.sessionId, live.testId, live.qIndex, players);
  const isLast = live.qIndex === test.questions.length-1;
  document.getElementById('liveHostBody').innerHTML = `
    <div class="live-big-q" style="font-size:1.4rem;">${escapeHtml(q.text)}</div>
    <div class="live-opt-grid" style="margin-bottom:26px;">${optHtml}</div>
    <div class="lead" style="font-size:1.1rem;margin-bottom:10px;">Reyting</div>
    ${leaderboard.slice(0,5).map((p,i)=>`
      <div class="live-lb-row">
        <span class="live-lb-rank">${i+1}</span>
        <span class="live-lb-name">${escapeHtml(p.name)}</span>
        <span class="live-lb-score">${p.score}</span>
      </div>`).join('') || '<div class="desc">Hali natija yo\'q</div>'}
    <div style="text-align:center;margin-top:22px;">
      ${isLast
        ? `<button class="btn-primary" onclick="hostEndSession()">Seansni yakunlash</button>`
        : `<button class="btn-primary" onclick="hostAdvanceQuestion(${live.qIndex+1})">Keyingi savol</button>`}
    </div>`;
}
async function computeCumulativeLeaderboard(sessionId, testId, uptoQIndex, players){
  const results = [];
  for(const p of players){
    let total = 0;
    for(let i=0;i<=uptoQIndex;i++){
      const a = await getLiveAnswer(sessionId, i, p.slug || slugify(p.name));
      if(a) total += (a.points||0);
    }
    results.push({name:p.name, score:total});
  }
  return results.sort((a,b)=>b.score-a.score);
}
async function hostEndSession(){
  const live = await loadLiveSession(state.hostChannel);
  if(!live) return;
  await saveLiveSession(state.hostChannel, {...live, status:'ended'});
  await storageDelete(`live-channel-active:${state.hostChannel}`);
  const test = state.config.tests.find(t=>t.id===live.testId);
  const players = await listLivePlayers(live.sessionId);
  const finalLb = await computeCumulativeLeaderboard(live.sessionId, live.testId, test.questions.length-1, players);
  document.getElementById('liveHostBody').innerHTML = `
    <div class="lead" style="text-align:center;margin-bottom:18px;">Yakuniy reyting — ${escapeHtml(test.topic)}</div>
    ${finalLb.map((p,i)=>`
      <div class="live-lb-row">
        <span class="live-lb-rank">${i+1}</span>
        <span class="live-lb-name">${escapeHtml(p.name)}</span>
        <span class="live-lb-score">${p.score}</span>
      </div>`).join('') || '<div class="desc">Hali natija yo\'q</div>'}
    <div style="text-align:center;margin-top:22px;">
      <button class="btn-ghost" onclick="openAdminDashboard()">Boshqaruv paneliga qaytish</button>
    </div>`;
  clearInterval(state.livePollTimer);
}
async function endLiveSessionAndExit(){
  if(!(await customConfirm("Jonli seansni tugatasizmi? O'quvchilar boshqa bu seansga ulasha olmaydi."))) return;
  hostEndSession();
}

let _chartInstance = null;

let _progressChartInstance = null;

async function renderAdminAnalytics(){
  const el = document.getElementById('adminTab-analytics');

  if(results.length===0){
    el.innerHTML = `<div class="empty">Tahlil qilish uchun hali natijalar mavjud emas.</div>`;
    return;
  }
  const byTopic = {};
  results.forEach(r=>{
    if(!byTopic[r.topic]) byTopic[r.topic] = [];
    byTopic[r.topic].push(r.percentage);
  });
  const topics = Object.keys(byTopic);
  const averages = topics.map(t=> Math.round(byTopic[t].reduce((a,b)=>a+b,0)/byTopic[t].length));

  const byGroup = {};
  results.forEach(r=>{
    const g = r.studentGroup || "Ko'rsatilmagan";
    if(!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(r.percentage);
  });
  const groups = Object.keys(byGroup);
  const groupAverages = groups.map(g=> Math.round(byGroup[g].reduce((a,b)=>a+b,0)/byGroup[g].length));

  const byStudent = {};
  results.forEach(r=>{
    if(!byStudent[r.studentName]) byStudent[r.studentName] = [];
    byStudent[r.studentName].push(r);
  });
  let studentRows = Object.entries(byStudent).map(([name, recs])=>{
    const avg = Math.round(recs.reduce((a,b)=>a+b.percentage,0)/recs.length);
    const weakest = [...recs].sort((a,b)=>a.percentage-b.percentage)[0];
    return {name, avg, count: recs.length, weakest};
  }).sort((a,b)=>a.avg-b.avg);
  const studentNames = Object.keys(byStudent).sort();

  el.innerHTML = `
    <div class="lead" style="margin-bottom:14px;">Mavzular bo'yicha o'rtacha natija</div>
    <canvas id="topicChart"></canvas>

    <div class="lead" style="margin:30px 0 14px;">Guruhlar bo'yicha solishtirma</div>
    <canvas id="groupChart"></canvas>

    <table>
      <thead><tr><th>O'quvchi</th><th>Topshirgan testlari</th><th>O'rtacha</th><th>Zaif mavzu</th></tr></thead>
      <tbody>
        ${studentRows.map(s=>`
          <tr>
            <td>${escapeHtml(s.name)}</td>
            <td>${s.count}</td>
            <td class="pct-cell ${s.avg<60?'pct-low':'pct-ok'}">${s.avg}%</td>
            <td>${escapeHtml(s.weakest.topic)} (${s.weakest.percentage}%)</td>
          </tr>`).join('')}
      </tbody>
    </table>

    <div class="lead" style="margin:30px 0 14px;">O'quvchi progressi (vaqt bo'yicha)</div>
    <div class="field" style="max-width:320px;">
      <label>O'quvchini tanlang</label>
      <select id="progressStudentSelect" onchange="renderProgressChart()">
        ${studentNames.map(n=>`<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('')}
      </select>
    </div>
    <canvas id="progressChart"></canvas>
  `;
  const ctx = document.getElementById('topicChart').getContext('2d');
  if(_chartInstance) _chartInstance.destroy();
  _chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: topics,
      datasets: [{
        label: "O'rtacha % ",
        data: averages,
        backgroundColor: averages.map(a=> a<60 ? '#E5584B' : '#2FC7AE'),
        borderRadius: 6
      }]
    },
    options: {
      responsive:true,
      plugins:{ legend:{display:false} },
      scales:{
        y:{ beginAtZero:true, max:100, ticks:{color:'#93B8B0'}, grid:{color:'rgba(255,255,255,0.06)'} },
        x:{ ticks:{color:'#93B8B0'}, grid:{display:false} }
      }
    }
  });

  const gctx = document.getElementById('groupChart').getContext('2d');
  if(_groupChartInstance) _groupChartInstance.destroy();
  _groupChartInstance = new Chart(gctx, {
    type: 'bar',
    data: {
      labels: groups,
      datasets: [{
        label: "Guruh o'rtacha %",
        data: groupAverages,
        backgroundColor: groupAverages.map(a=> a<60 ? '#E5584B' : '#F4F7F6'),
        borderRadius: 6
      }]
    },
    options: {
      responsive:true,
      plugins:{ legend:{display:false} },
      scales:{
        y:{ beginAtZero:true, max:100, ticks:{color:'#93B8B0'}, grid:{color:'rgba(255,255,255,0.06)'} },
        x:{ ticks:{color:'#93B8B0'}, grid:{display:false} }
      }
    }
  });

  renderProgressChart();
}
function renderProgressChart(){
  const select = document.getElementById('progressStudentSelect');
  if(!select) return;

  if(!val){ showToast("Kod bo'sh bo'lmasligi kerak.", true); return; }

  const prev = state.config.adminCode;
  state.config.adminCode = val;
  const ok = await saveConfig(state.config);
  if(ok) showToast("Admin kodi yangilandi ✓");
  else state.config.adminCode = prev; // roll back in-memory value if save failed
}
async function saveRahbarCode(){
  const val = document.getElementById('ownerRahbarCodeInput').value.trim();
  if(!val){ showToast("Kod bo'sh bo'lmasligi kerak.", true); return; }
  if(val === state.config.adminCode){ showToast("Rahbar kodi Admin kodi bilan bir xil bo'lmasligi kerak.", true); return; }
  const prev = state.config.rahbarCode;
  state.config.rahbarCode = val;
  const ok = await saveConfig(state.config);
  if(ok) showToast("Rahbar kodi yangilandi ✓");
  else state.config.rahbarCode = prev;
}
async function togglePermission(){
  const newVal = !state.config.permissions.adminCanDeleteTests;
  state.config.permissions.adminCanDeleteTests = newVal;
  const ok = await saveConfig(state.config);
  if(ok) showToast(newVal ? "Ruxsat berildi ✓" : "Ruxsat bekor qilindi ✓");
  else state.config.permissions.adminCanDeleteTests = !newVal;
  renderOwnerPanel();
}

/* ============ UTIL ============ */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
